<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>宠物连连看</title>
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
  }
  h1 { margin-top: 20px; }

  #game {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    gap: 5px;
    justify-content: center;
    margin-top: 20px;
  }

  .tile {
    width: 60px;
    height: 60px;
    font-size: 30px;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .selected {
    background: #ffd54f;
  }

  .hidden {
    visibility: hidden;
  }
</style>
</head>
<body>

<h1>🐾 宠物连连看</h1>
<p>点击两个相同宠物进行消除</p>

<div id="game"></div>

<script>
const animals = ["🐶","🐱","🐰","🐼","🐸","🐵","🐷","🐔"];
let tiles = [];
let first = null;
let second = null;

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

// create pairs
function init() {
  let arr = [];
  animals.forEach(a => {
    arr.push(a);
    arr.push(a);
  });

  // duplicate to fill grid
  arr = arr.concat(arr);
  arr = shuffle(arr);

  const game = document.getElementById("game");
  game.innerHTML = "";

  arr.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "tile";
    div.innerText = a;
    div.dataset.value = a;
    div.onclick = () => clickTile(div);
    game.appendChild(div);
  });
}

function clickTile(tile) {
  if (tile.classList.contains("hidden")) return;

  if (!first) {
    first = tile;
    tile.classList.add("selected");
  } else if (!second && tile !== first) {
    second = tile;
    tile.classList.add("selected");

    setTimeout(checkMatch, 300);
  }
}

function checkMatch() {
  if (first.dataset.value === second.dataset.value) {
    first.classList.add("hidden");
    second.classList.add("hidden");
  }

  first.classList.remove("selected");
  second.classList.remove("selected");
  first = null;
  second = null;
}

init();
</script>

</body>
</html>
