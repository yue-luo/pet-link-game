<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>宠物连连看</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

#info {
  margin-top: 10px;
  font-size: 18px;
}

#game {
  display: grid;
  gap: 5px;
  justify-content: center;
  margin-top: 20px;
}

.tile {
  width: 60px;
  height: 60px;
  font-size: 30px;
  background: white;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.selected {
  background: #ffd54f;
}

.hidden {
  visibility: hidden;
}
</style>
</head>
<body>

<h1>🐾 宠物连连看</h1>

<div id="info">
  ⏱ 时间: <span id="time">600</span>s |
  🎮 关卡: <span id="level">1</span>
</div>

<div id="game"></div>

<script>
const animals = ["🐶","🐱","🐰","🐼","🐸","🐵","🐷","🐔","🦊","🐯","🐮","🐤"];

let gridSize = 8; // 8x8
let level = 1;
let timeLeft = 600; // 10 mins

let first = null;
let second = null;

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function generateTiles() {
  let needed = gridSize * gridSize;
  let arr = [];

  while (arr.length < needed) {
    let a = animals[Math.floor(Math.random() * animals.length)];
    arr.push(a, a);
  }

  return shuffle(arr.slice(0, needed));
}

function init() {
  const game = document.getElementById("game");
  game.innerHTML = "";
  game.style.gridTemplateColumns = `repeat(${gridSize}, 60px)`;

  const tiles = generateTiles();

  tiles.forEach(val => {
    const div = document.createElement("div");
    div.className = "tile";
    div.innerText = val;
    div.dataset.value = val;
    div.onclick = () => clickTile(div);
    game.appendChild(div);
  });
}

function clickTile(tile) {
  if (tile.classList.contains("hidden")) return;

  if (!first) {
    first = tile;
    tile.classList.add("selected");
  } else if (!second && tile !== first) {
    second = tile;
    tile.classList.add("selected");

    setTimeout(checkMatch, 200);
  }
}

function checkMatch() {
  if (first.dataset.value === second.dataset.value) {
    first.classList.add("hidden");
    second.classList.add("hidden");

    checkWin();
  }

  first.classList.remove("selected");
  second.classList.remove("selected");
  first = null;
  second = null;
}

function checkWin() {
  const remaining = document.querySelectorAll(".tile:not(.hidden)");
  if (remaining.length === 0) {
    level++;
    gridSize = Math.min(10, gridSize + 1); // harder
    alert("🎉 进入下一关 Level " + level);
    init();
  }
}

function startTimer() {
  const timer = setInterval(() => {
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      alert("⏰ 时间到！游戏结束");
      location.reload();
    }
  }, 1000);
}

// start game
init();
startTimer();
</script>

</body>
</html>
